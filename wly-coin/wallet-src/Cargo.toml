[package]
name = "wly-wallet"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[dependencies]
anyhow = "1"
argon2 = "0.5"
bitcoin = "0.32"
bs58 = { version = "0.5", features = ["check"] }
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
rand = "0.8"
num-bigint = "0.4"
scrypt = { version = "0.11", default-features = false }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
indicatif = "0.18.6"
